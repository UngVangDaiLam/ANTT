# Chạy PostgreSQL cho máy cá nhân:  docker compose -f deploy/docker-compose.yml up -d
# (Server và Caddy sẽ thêm vào đây ở tuần 7 khi deploy.)
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: securenotes
      POSTGRES_PASSWORD: securenotes
      POSTGRES_DB: securenotes
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
