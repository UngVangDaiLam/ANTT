name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - name: Kiểm tra ranh giới kiến trúc (server không dùng crypto)
        run: pnpm depcheck
      - run: pnpm test
      - name: Kiểm tra lỗ hổng thư viện
        run: pnpm audit --audit-level high
